<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>claude-video-studio</title>
<style>
  html, body { margin: 0; background: #16141c; color: #ddd; font: 13px system-ui, sans-serif; }
  main { padding: 12px; display: grid; gap: 8px; max-width: 1280px; }
  #out { width: 100%; aspect-ratio: 16 / 9; height: auto; background: #333; }
  .p5Canvas, canvas.lowres { display: none !important; }
  .bar { display: flex; gap: 10px; align-items: center; }
  #scrub { flex: 1; }
</style>
<script>
  // studio.html?project=<dir>&style=<name>[&render][&t=seconds][&pd=pixelDensity]
  const Q = new URLSearchParams(location.search);
  const STYLE_NAME = Q.get('style') || 'watercolor';
  const PROJECT_DIR = (Q.get('project') || '../examples/spirochete').replace(/\/$/, '');
  const RENDER_MODE = Q.has('render');
  const NEEDS_P5 = ['watercolor', 'ink'].includes(STYLE_NAME);
  if (NEEDS_P5) document.write('<script src="vendor/p5.min.js"><\/script><script src="vendor/p5.brush.js"><\/script>');
</script>
<script src="core.js"></script>
<script>
  document.write(`<script src="styles/${STYLE_NAME}.js"><\/script>`);
  document.write(`<script src="${PROJECT_DIR}/scenes.js"><\/script>`);
</script>
</head>
<body>
<main>
  <canvas id="out" width="1920" height="1080"></canvas>
  <div class="bar"><input id="scrub" type="range" min="0" max="10" step="0.0417" value="0"><span id="tt">loading…</span></div>
</main>
<script>
  // Interactive preview (when not rendering): scrub through the film.
  (async () => {
    while (!window.ready) await new Promise(r => setTimeout(r, 50));
    if (RENDER_MODE) return;
    const s = document.getElementById('scrub'), lab = document.getElementById('tt');
    s.max = PROJ.duration; let busy = false, want = +(Q.get('t') || 0); s.value = want;
    const go = async () => { if (busy) return; busy = true; while (want != null) { const t = want; want = null; const t0 = performance.now(); await STYLE.render(t); lab.textContent = `${t.toFixed(2)}s · ${Math.round(performance.now() - t0)} ms · ${STYLE.name}`; } busy = false; };
    s.addEventListener('input', () => { want = +s.value; go(); }); go();
  })();
</script>
</body>
</html>
